# ── 三协议端点配置 · openai-responses ────────────────────────────────
# 模板（未实测；接入自建 Responses 网关时替换并填 GATEWAY_API_KEY）。

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      gateway-responses:
        displayName: 自建网关（openai-responses）
        apiKeyEnv: GATEWAY_API_KEY
        api: openai-responses
        baseURL: https://your-responses-gateway/v1   # ← 替换
        models:
          - id: your-model-id
            name: Your Model
            contextWindow: 262144
            maxTokens: 32768
        # compat:
        #   maxTokensField: max_output_tokens

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: gateway-responses
    model: your-model-id
