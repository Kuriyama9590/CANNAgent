name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-demo:
    name: web-demo 构建（tsc + vite build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
      - run: npm ci
      - run: npm run build

  plugins:
    name: plugins（pnpm + eslint + tsc + vitest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  python:
    name: python（ruff + mypy + pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[dev,onnx,server]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy cannagent
      - run: pytest -q

  web:
    name: web 真实 dashboard 构建（tsc + vite build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  commitlint:
    name: 提交信息规范（conventional commits）
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/commitlint.config.mjs
