[project]
name = "cannagent"
version = "0.1.0"
description = "CannAgent 领域执行层：七阶段工具实现 + 事件流写入 + FastAPI 观测服务"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
onnx = ["onnx>=1.15"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
bge = ["sentence-transformers>=3.0"]  # 生产态 embedder（rag.md §2；开发默认 hash）
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cannagent*"]

[tool.setuptools.package-data]
cannagent = ["templates/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
# 3.12：依赖 stub（numpy 等）使用 PEP 695 type 语句，低版本目标无法解析
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120  # 防无限流/挂死用例拖死 CI
